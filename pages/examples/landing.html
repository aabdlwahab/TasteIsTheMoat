<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Landing page example — Taste is the Moat</title>
    <link rel="icon" href="/TasteIsTheMoat/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f97316" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #07080c; color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

      .hero { position: relative; min-height: 100vh; display: grid;
        place-items: center; text-align: center; overflow: hidden; padding: 24px; }

      /* The shader canvas sits behind the content. */
      #hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; }

      /* A scrim keeps text legible over any shader. */
      .hero::after {
        content: ""; position: absolute; inset: 0;
        background: radial-gradient(ellipse at center,
          rgba(7, 8, 12, 0.25) 0%, rgba(7, 8, 12, 0.75) 100%);
        pointer-events: none;
      }

      .hero-content { position: relative; z-index: 1; max-width: 720px; }
      h1 { font-size: clamp(2.2rem, 6vw, 4rem); line-height: 1.05;
        margin: 0 0 18px; letter-spacing: -0.02em; }
      p { font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.6;
        color: #c9cee0; margin: 0 0 32px; }
      .cta { display: inline-flex; gap: 12px; flex-wrap: wrap;
        justify-content: center; }
      .btn { padding: 13px 24px; border-radius: 10px; text-decoration: none;
        font-weight: 600; font-size: 15px; }
      .btn.primary { background: #fff; color: #0a0b12; }
      .btn.ghost { border: 1px solid rgba(255,255,255,0.3); color: #fff; }

      .picker { position: fixed; bottom: 20px; left: 50%;
        transform: translateX(-50%); display: flex; gap: 6px; z-index: 2;
        max-width: calc(100vw - 32px); overflow-x: auto;
        background: rgba(10,11,16,0.6); padding: 8px; border-radius: 12px;
        backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
      .picker button { background: transparent; border: 1px solid transparent;
        color: #c9cee0; padding: 7px 13px; border-radius: 8px; cursor: pointer;
        font: inherit; font-size: 13px; }
      .picker button:hover { background: rgba(255,255,255,0.08); }
      .picker button.active { background: #fff; color: #0a0b12; font-weight: 600; }
    </style>
    <script type="module" crossorigin src="/TasteIsTheMoat/assets/landing-C_rXpu5I.js"></script>
    <link rel="modulepreload" crossorigin href="/TasteIsTheMoat/assets/shaders-CayAUA1p.js">
    <link rel="modulepreload" crossorigin href="/TasteIsTheMoat/assets/renderer-B8-08lV-.js">
    <link rel="modulepreload" crossorigin href="/TasteIsTheMoat/assets/poster-DPf8j3x_.js">
  </head>
  <body>
    <section class="hero">
      <canvas id="hero-bg"></canvas>
      <div class="hero-content">
        <h1>Ship a landing page that moves.</h1>
        <p>
          Drop-in WebGL shader backgrounds. Sixty-nine hand-tuned looks, one tiny
          runtime, zero dependencies — and they pause themselves when nobody's
          looking.
        </p>
        <div class="cta">
          <a class="btn primary" href="#">Get started</a>
          <a class="btn ghost" href="#">View shaders</a>
        </div>
      </div>
    </section>

    <div class="picker" id="picker"></div>

  </body>
</html>
