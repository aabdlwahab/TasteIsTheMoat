<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact sheet — every shader at once</title>
    <style>
      html, body { margin: 0; background: #0a0b0f; color: #e7e9f0;
        font-family: system-ui, sans-serif; }
      h1 { font-size: 15px; padding: 14px 16px 0; margin: 0; font-weight: 600; }
      p.sub { margin: 4px 16px 14px; color: #868da3; font-size: 12.5px; }
      .grid { display: grid; gap: 10px; padding: 0 16px 24px;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
      figure { margin: 0; border: 1px solid #242838; border-radius: 12px;
        overflow: hidden; background: #12141c; }
      canvas { width: 100%; aspect-ratio: 16/9; display: block; background: #000; }
      figcaption { padding: 7px 10px 9px; font-size: 12px; }
      .cat { color: #868da3; font-size: 10.5px; text-transform: uppercase;
        letter-spacing: 0.06em; }
      .int { color: #9aa4ff; }
    </style>
  </head>
  <body>
    <h1>Taste is the Moat — shader contact sheet</h1>
    <p class="sub">
      Every shader in the library, rendered live from a single shared WebGL
      context. Useful for reviewing the whole set at a glance.
    </p>
    <div class="grid" id="grid"></div>

    <script type="module">
      import { shaderList } from "../src/shaders/index.ts";
      import { ThumbnailPool } from "../src/app/thumbnails.ts";

      const pool = new ThumbnailPool(400, 225);
      const grid = document.getElementById("grid");

      for (const def of shaderList) {
        const fig = document.createElement("figure");
        fig.innerHTML = `
          <canvas></canvas>
          <figcaption>
            <div>${def.name} ${def.interactive ? '<span class="int">✦</span>' : ""}</div>
            <div class="cat">${def.category}</div>
          </figcaption>`;
        grid.appendChild(fig);
        pool.add(fig.querySelector("canvas"), def);
      }
    </script>
  </body>
</html>
